name: fetch-weather
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST (기상청·에어코리아 05시 발표 반영)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능
  push:                      # 스크립트가 바뀌면 바로 테스트 실행
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]
permissions:
  contents: write
concurrency: fetch-weather
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q eccodes ecmwf-opendata requests
      - name: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/fetch_all.py
      - name: commit
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add data
          git commit -m "data $(TZ=Asia/Seoul date +%Y-%m-%d_%H%M)" || echo "no changes"
          git push
